<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Britannia Good Day Yellow Biscuit Packet -->
  <rect x="14" y="22" width="72" height="56" rx="8" fill="#F59E0B" stroke="#D97706" stroke-width="2" />
  <rect x="20" y="28" width="60" height="44" rx="5" fill="#FEF3C7" />
  <!-- Red Brand Box -->
  <rect x="30" y="32" width="40" height="12" rx="3" fill="#DC2626" />
