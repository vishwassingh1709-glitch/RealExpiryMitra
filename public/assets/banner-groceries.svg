<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="100%" height="100%">
  <!-- Grocery Shelves Illustration -->
  <defs>
    <linearGradient id="shelfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Store background frame -->
  <rect x="5" y="10" width="150" height="85" rx="10" fill="#FEF3C7" opacity="0.6" />
  
  <!-- Grocery Shelf 1 -->
  <rect x="20" y="20" width="120" height="6" rx="2" fill="#D97706" />
  <!-- Items on Shelf 1 -->
  <rect x="25" y="6" width="12" height="14" rx="2" fill="#EF4444" />
  <rect x="42" y="4" width="10" height="16" rx="2" fill="#10B981" />
  <rect x="57" y="8" width="14" height="12" rx="2" fill="#3B82F6" />
  <rect x="76" y="5" width="12" height="15" rx="2" fill="#F59E0B" />
  <circle cx="100" cy="13" r="6" fill="#10B981" />
  <circle cx="114" cy="13" r="6" fill="#EF4444" />
  <circle cx="128" cy="13" r="6" fill="#F59E0B" />

  <!-- Grocery Shelf 2 -->
  <rect x="20" y="55" width="120" height="6" rx="2" fill="#D97706" />
  <!-- Items on Shelf 2 -->
  <rect x="25" y="36" width="16" height="19" rx="3" fill="#3B82F6" />
  <polygon points="25,36 33,30 41,36" fill="#60A5FA" />
  <rect x="48" y="34" width="14" height="21" rx="2" fill="#EC4899" />
  <rect x="68" y="38" width="18" height="17" rx="3" fill="#8B5CF6" />
  <rect x="92" y="35" width="15" height="20" rx="3" fill="#10B981" />
  <rect x="114" y="37" width="20" height="18" rx="2" fill="#F97316" />

  <!-- Fresh Plant Leaf on Corner -->
  <path d="M 0 60 C 15 45, 30 70, 10 95 C 0 85, -5 70, 0 60 Z" fill="#10B981" opacity="0.9" />
  <path d="M 160 30 C 145 20, 135 40, 150 55 C 158 50, 160 40, 160 30 Z" fill="#34D399" opacity="0.8" />
</svg>
